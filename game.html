<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة العد للفلاح</title>
    <link rel="stylesheet" href="game.css"> 
</head>
<body>
    <div id="start-page" class="page">
        <div class="game-box">
            <h1>مرحبًا بكم في مزرعتنا!</h1>
            <button onclick="startGame()">لننطلق</button>
        </div>
    </div>

    <div id="game-page" class="page" style="display: none;">
        <div class="game-box">
            <button type="button" class="button refresh-button" onclick="goToStartPage()">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    fill="currentColor"
                    class="bi bi-arrow-repeat"
                    viewBox="0 0 16 16"
                >
                    <path
                        d="M11.534 7h3.932a.25.25 0 0 1 .192.41l-1.966 2.36a.25.25 0 0 1-.384 0l-1.966-2.36a.25.25 0 0 1 .192-.41zm-11 2h3.932a.25.25 0 0 0 .192-.41L2.692 6.23a.25.25 0 0 0-.384 0L.342 8.59A.25.25 0 0 0 .534 9z"
                    ></path>
                    <path
                        fill-rule="evenodd"
                        d="M8 3c-1.552 0-2.94.707-3.857 1.818a.5.5 0 1 1-.771-.636A6.002 6.002 0 0 1 13.917 7H12.9A5.002 5.002 0 0 0 8 3zM3.1 9a5.002 5.002 0 0 0 8.757 2.182.5.5 0 1 1 .771.636A6.002 6.002 0 0 1 2.083 9H3.1z"
                    ></path>
                </svg>
                Refresh
            </button>

            <div class="farmer-background">
                <img src="farmer.png" alt="فلاح" class="farmer">
                <div class="animals">
                    <img src="goat.png" alt="معزة" class="animal">
                    <img src="goat.png" alt="معزة" class="animal">
                    <img src="goat.png" alt="معزة" class="animal">
                    <img src="goat.png" alt="معزة" class="animal">
                    <img src="goat.png" alt="معزة" class="animal">
                    <img src="sheep.png" alt="خروف" class="animal">
                    <img src="sheep.png" alt="خروف" class="animal">
                    <img src="sheep.png" alt="خروف" class="animal">
                    <img src="sheep.png" alt="خروف" class="animal">
                    <img src="sheep.png" alt="خروف" class="animal">
                </div>
            </div>
            <div class="question">
                <p>كم عدد أكياس الغلال التي يمتلكها هذا الفلاح؟</p>
                <input type="number" id="answer" placeholder="أدخل الإجابة هنا">
                <!-- زر التحقق -->
                <button class="button" onclick="checkAnswer()">تحقق</button>
            </div>
            <p id="result"></p>
        </div>
    </div>

    <script src="game.js"></script> 
</body>
</html>
